	<style>
		body {
			margin: 0;        /* Remove default browser margin */
			overflow: hidden; /* Optional: Hide body scrollbars if any */
		}
	
		iframe {
			display: block;	   /* Force block level to remove inline spacing gaps */
			width : 100vw;     /* 100% of viewport width */
			height: 100vh;     /* 100% of viewport height */
			border: none;      /* Remove the default border frame */
		}
	</style>

	<script>
		window.onload = () => {

			const iframe    = document.getElementById('iframeId');
			const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
			const meetings  = iframeDoc.getElementById('meetings');

			meetings.style.display = 'none';
		}
	</script>

<body>
	<iframe src="../index.html" id="iframeId"></iframe>
